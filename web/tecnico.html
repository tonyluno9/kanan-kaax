    porMes.forEach(function (v) { mx = Math.max(mx, (v[0] + v[1] + v[2]) / ny); });
    function Y(v) { return H - B - (H - B - Tp) * v / mx; }
    var bw = (W - L - 10) / 12, g = ['<text x="' + L + '" y="14" style="font-weight:600;fill:#1c2430">' + t("Detecciones promedio por mes, según el tipo de evento", "Average detections per month, by type of event") + "</text>"];
    for (e = 0; e <= 4; e++) { var yy = Y(mx * e / 4); g.push('<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + yy + '" y2="' + yy + '" stroke="#e6e9ee"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + fmt(mx * e / 4) + "</text>"); }
    porMes.forEach(function (v, k) { var base = 0;
      for (var c = 0; c < 3; c++) { var h = v[c] / ny; if (h <= 0) continue;
        g.push('<rect x="' + (L + k * bw + 5) + '" y="' + Y(base + h) + '" width="' + (bw - 10) + '" height="' + (Y(base) - Y(base + h)) + '" fill="' + CLASES[c][0] + '"><title>' + NOML[k] + ": " + fmt(h) + " · " + CLASES[c][1] + "</title></rect>"); base += h; }
      g.push('<text x="' + (L + k * bw + bw / 2) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + NOM[k] + "</text>"); });
    CLASES.forEach(function (q, c) { var yl = H - 26 + (c > 1 ? 14 : 0), xl = L + (c === 1 ? 330 : 0);
      g.push('<rect x="' + xl + '" y="' + (yl - 9) + '" width="10" height="10" fill="' + q[0] + '"/><text x="' + (xl + 14) + '" y="' + yl + '">' + q[1] + "</text>"); });
    $("tipoMes").innerHTML = g.join("");
    $("tipoListaT").textContent = t("Incendios grandes o largos en la zona (haz clic para verlo en el mapa)", "Large or long fires in the area (click to see it on the map)");
    $("tipoLista").innerHTML = grandes.slice(0, 25).map(function (e) {
      return '<div class="evento" data-c="' + e[5] + '"><b>' + e[0] + (e[1] !== e[0] ? " → " + e[1] : "") + "</b> · " + e[2].toLocaleString(LOC) + t(" detecciones", " detections") + " · " + e[3].toFixed(2) + ", " + e[4].toFixed(2) + "</div>";
    }).join("") || '<div class="nota">' + t("Ninguno en esta zona.", "None in this area.") + "</div>";
    $("tipoNota").textContent = t("Cómo se clasifica: las detecciones VIIRS a menos de ", "How it is classified: VIIRS detections less than ") + R.dist_km + t(" km y a no más de 1 día de distancia forman un evento. Pequeño: hasta ", " km and at most 1 day apart form one event. Small: up to ") +
      R.peq_n + t(" detecciones en un solo día. Grande o largo: ", " detections in a single day. Large or long: ") + R.grande_n + t(" detecciones o más, o ", " detections or more, or ") + R.grande_dias +
      t(" días o más. Es una estimación: un punto de calor no dice la causa del fuego. Prueba: en Portugal, donde quemar está prohibido en verano, casi todos los incendios grandes caen en ese período y la mayoría de las quemas pequeñas, fuera (sección 10).",
        " days or more. It is an estimate: a hot spot does not tell what caused the fire. A check: in Portugal, where burning is banned in summer, almost all large fires fall in that period and most small burns fall outside it (section 10).");
  }
  $("tipoLista").addEventListener("click", function (ev) {
    var d = ev.target.closest ? ev.target.closest(".evento") : null; if (!d) return;
    estado.resaltar = +d.getAttribute("data-c"); dibujarMapa(); if (svg.scrollIntoView) svg.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  (function () { var sc = document.createElement("script"); sc.src = "data/extra/" + M.clave + ".js"; sc.onerror = function () {}; document.head.appendChild(sc); })();

  // ---------------- Controls ----------------
  function todo() {
    var s = serieSel(), b = estado.sel ? cajaDe(estado.sel) : [LON0, LAT0, LON1, LAT1];
    $("lo0").value = b[0]; $("la0").value = b[1]; $("lo1").value = b[2]; $("la1").value = b[3];
    $("selTxt").textContent = estado.sel ? t("Zona: ", "Area: ") + estado.sel.length + t(" celdas, latitud ", " cells, latitude ") + b[1] + t(" a ", " to ") + b[3] + t(", longitud ", ", longitude ") + b[0] + t(" a ", " to ") + b[2] + "."
      : t("Zona: toda la región.", "Area: whole region.");
    pararSon(); dibujarBriefing(s); dibujarMapa(); dibujarCalendario(s); dibujarResumen(s); dibujarAnomalias(); if (EX) dibujarTipo();
  }
  ["a0", "a1"].forEach(function (id) {
    $(id).innerHTML = anios.map(function (a) { return "<option>" + a + "</option>"; }).join("");
    $(id).addEventListener("change", function () {
      estado.a0 = +$("a0").value; estado.a1 = +$("a1").value;
      if (estado.a0 > estado.a1) { var x = estado.a0; estado.a0 = estado.a1; estado.a1 = x; $("a0").value = estado.a0; $("a1").value = estado.a1; }
      todo();
    });
  });
  $("a0").value = estado.a0; $("a1").value = estado.a1;
  $("btnTodo").addEventListener("click", function () { estado.sel = null; estado.poli = null; estado.resaltar = -1; modoPoli = false; vertices = []; $("btnPoliFin").style.display = "none"; pon("btnPoli", "Dibujar polígono", "Draw polygon"); todo(); });
  $("btnPoli").addEventListener("click", function () {
    if (modoPoli) { modoPoli = false; vertices = []; $("btnPoliFin").style.display = "none"; pon("btnPoli", "Dibujar polígono", "Draw polygon"); dibujarMapa(); return; }
    modoPoli = true; vertices = []; $("btnPoliFin").style.display = ""; pon("btnPoli", "Cancelar", "Cancel");
    pon("selTxt", "Haz clic en el mapa para marcar cada vértice y luego «Terminar polígono».", "Click on the map to place each vertex, then “Finish polygon”.");
  });
  $("btnPoliFin").addEventListener("click", terminarPoligono);
  $("chkCrudo").addEventListener("change", function () {
    estado.crudo = $("chkCrudo").checked;
    $("crudoNota").style.display = estado.crudo ? "block" : "none";
    todo();
  });
  pon("crudoNota", "Registro SIN armonizar. El aumento que se ve cuando empieza VIIRS no es más fuego: es otro sensor que detecta más puntos. Así se vería la historia si se juntaran los datos tal cual.",
    "UNHARMONIZED record. The increase you see when VIIRS starts is not more fire: it is a different sensor that detects more hot spots. This is what history would look like if the data were simply put together.");
  (function () {
    var c = $("anioCmp"), porAnio = {}; for (var k = 0; k <= ultimo; k++) porAnio[ANIO[k]] = 1;
    c.innerHTML = anios.slice().reverse().filter(function (a) { return porAnio[a]; }).map(function (a) { return "<option>" + a + "</option>"; }).join("");
    c.addEventListener("change", function () { dibujarAcumulado(serieSel()); });
  })();
  $("btnCoord").addEventListener("click", function () { seleccionarCaja(+$("lo0").value, +$("la0").value, +$("lo1").value, +$("la1").value); });
  $("rampa").style.background = "linear-gradient(90deg," + VIR.join(",") + ")";
  dibujarValidacion(); dibujarClaves(); todo(); dibujarRiesgo(); dibujarAreas(); dibujarEvidencia();
})();
</script>
