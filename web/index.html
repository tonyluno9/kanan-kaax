<!DOCTYPE html>
<!--
  Kanan Ka'ax (Burn Calendar · Calendario de quemas) · team La Com · NASA Space Apps Challenge 2026
  Challenge: Harmonization of MODIS and VIIRS Hot Spots.
  AI disclosure: this file was generated with the assistance of an AI tool (Claude, by Anthropic)
  and reviewed by the team. Data: NASA FIRMS, NASA POWER, NASA GIBS. Map tiles: NASA GIBS, OpenStreetMap; labels: Esri.
  Search: OpenStreetMap Nominatim (one request at a time, only when the user searches).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanan Ka'ax</title>
<meta name="description" content="25 years of satellite fire, harmonized from MODIS and VIIRS, for any place. Search an address, see when it burns, whether this year is normal and what is unusual.">
<meta property="og:title" content="Kanan Ka'ax: 25 years of satellite fire for any place">
<meta property="og:description" content="Harmonized MODIS + VIIRS burning activity calendar with NASA satellite maps, address search, critical periods, anomalies, weekly risk and an alert verified from space.">
<meta property="og:image" content="data/evidencia/yb_despues.jpg">
<meta name="theme-color" content="#05070D">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<!-- NASA Horizon Design System typefaces: Inter (headings), Public Sans (body), DM Mono (numbers and data) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link rel="stylesheet" href="css/tokens.css?v=20261116c">
<link rel="stylesheet" href="css/app.css?v=20261116c">
<script src="js/iconos.js?v=20261116c"></script>
<script src="js/contornos.js?v=20261116c"></script>
</head>
<body class="entrando con-heroe">
<a class="sr-only" href="#panel">Skip to results</a>

<!-- ============ Map (full bleed) and its floating controls ============ -->
<div id="mapa">
  <div class="flot capas seg" id="capas" role="group" aria-label="Base map"></div>
  <div class="flot fecha" id="fechaBox"><label><span id="lFecha" class="kicker"></span> <input type="date" id="fecha" class="mono"></label></div>
  <div class="flot modo" id="modo" role="status"><i class="modo-dot" aria-hidden="true"></i><span id="modoTxt"></span><button id="modoX" class="icon-btn sm" aria-label="Close"></button></div>
  <div class="flot leyenda" id="leyenda"></div>
  <div class="flot tiempo" id="tiempo">
    <button class="play" id="play" aria-label="Play"></button>
    <div class="t-meta">
      <span class="kicker" id="repKick"></span>
      <b id="repTxt" class="mono"></b>
    </div>
    <div class="t-pista">
      <input type="range" id="repSem" min="0" max="51" value="0" aria-label="Week">
      <div class="t-meses" id="repMeses" aria-hidden="true"></div>
    </div>
    <select id="repAnio" class="mono" aria-label="Year"></select>
  </div>
  <div class="flot bienvenida" id="bienvenida" role="dialog" aria-labelledby="bTit">
    <button class="icon-btn x" id="cerrarBienv" aria-label="Close"></button>
    <div class="kicker b-kick" id="bKick"></div>
    <h2 id="bTit" class="serif"></h2>
    <p id="bTxt"></p>
    <div class="b-cifras" id="bCifras"></div>
    <div class="atajos" id="atajos"></div>
    <div class="b-pista" id="bPista"></div>
  </div>
</div>

<!-- ============ Floating top bar ============ -->
<header class="top" id="barra">
  <div class="brand"><span class="logo" id="logo"></span><div class="brand-txt"><h1 id="titulo">Kanan Ka'ax</h1><small id="subtitulo"></small></div></div>
  <form class="search" id="formBuscar" autocomplete="off" role="search">
    <span class="lupa" id="lupa" aria-hidden="true"></span>
    <input id="q" type="search" aria-label="Search" aria-controls="resultados" aria-autocomplete="none">
    <kbd class="atajo-k mono" id="kbdK" aria-hidden="true">Ctrl K</kbd>
    <button class="ir" id="btnIr" type="submit" aria-label="Go"></button>
    <div class="resultados" id="resultados" role="listbox"></div>
  </form>
  <div class="acciones">
    <label class="sel-wrap"><span class="sr-only">Region</span><select class="chipbtn" id="selRegion" aria-label="Region"></select></label>
    <button class="chipbtn" id="btnIdioma"></button>
  </div>
</header>

<!-- ============ Results sheet (side sheet on desktop, bottom sheet on mobile) ============ -->
<aside class="panel" id="panel" aria-label="Results">
  <div class="agarradera" id="agarradera" role="button" tabindex="0" aria-label="Resize panel"><i></i></div>
  <div class="panel-cab">
    <div id="avisoSint"></div>
    <div class="lugar"><span class="pin" id="lugarPin"></span><div class="lugar-txt"><span class="kicker" id="lugarKick"></span><h2 id="lugarNom" class="serif"></h2><div class="sub mono" id="lugarSub"></div></div></div>
    <div class="escala seg" id="escala" role="group"></div>
  </div>
  <div class="panel-scroll" id="panelScroll">
    <div class="sec respuestas">
      <div class="kicker" id="kResp"></div>
      <article class="respuesta" id="r1"></article>
      <article class="respuesta" id="r2"></article>
      <article class="respuesta" id="r3"></article>
    </div>
    <div id="anclaTabs"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section class="tab" id="tab-cal" role="tabpanel"></section>
    <section class="tab" id="tab-anios" role="tabpanel"></section>
    <section class="tab" id="tab-alertas" role="tabpanel"></section>
    <section class="tab" id="tab-reglas" role="tabpanel"></section>
    <section class="tab" id="tab-tipo" role="tabpanel"></section>
    <section class="tab" id="tab-riesgo" role="tabpanel"></section>
    <section class="tab" id="tab-nal" role="tabpanel"></section>
    <section class="tab" id="tab-areas" role="tabpanel"></section>
    <section class="tab" id="tab-prueba" role="tabpanel"></section>
    <section class="tab" id="tab-como" role="tabpanel"></section>
    <footer class="pie" id="pie"></footer>
  </div>
</aside>
<div id="tip" role="tooltip"></div>

<script src="data/regiones.js"></script>
<script>
  (function () {
    var R = window.REGIONES || [], q = null, l = null;
    try { var u = new URLSearchParams(location.search); q = u.get("region"); l = u.get("lang"); } catch (e) {}
    var ok = R.some(function (r) { return r.clave === q; });
    window.CLAVE_REGION = ok ? q : (R[0] ? R[0].clave : "yucatan");
    // ?lang wins; otherwise the browser language (Spanish if it starts with "es", English for everything else)
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    window.IDIOMA = l === "es" || l === "en" ? l : (/^es/i.test(nav) ? "es" : "en");
    document.write('<script src="data/' + window.CLAVE_REGION + '.js"><\/script>');
  })();
</script>
<script src="js/nal.js?v=20261116c"></script>
<script src="js/app.js?v=20261116c"></script>
</body>
</html>
