<!DOCTYPE html>
<!--
  Burn Calendar (Calendario de quemas) · team La Com · NASA Space Apps Challenge 2026
  Challenge: Harmonization of MODIS and VIIRS Hot Spots.
  AI disclosure: this file was generated with the assistance of an AI tool (Claude, by Anthropic)
  and reviewed by the team. Data: NASA FIRMS, NASA POWER, NASA GIBS. Map tiles: NASA GIBS, OpenStreetMap; labels: Esri.
  Search: OpenStreetMap Nominatim (one request at a time, only when the user searches).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burn Calendar</title>
<meta name="description" content="25 years of satellite fire, harmonized from MODIS and VIIRS, for any place. Search an address, see when it burns, whether this year is normal and what is unusual.">
<meta property="og:title" content="Burn Calendar: 25 years of satellite fire for any place">
<meta property="og:description" content="Harmonized MODIS + VIIRS burning activity calendar with NASA satellite maps, address search, critical periods, anomalies, weekly risk and an alert verified from space.">
<meta property="og:image" content="data/evidencia/yb_despues.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">🔥</div><div><h1 id="titulo">Burn Calendar</h1><small id="subtitulo"></small></div></div>
  <form class="search" id="formBuscar" autocomplete="off" role="search">
    <span class="lupa" aria-hidden="true">⌕</span>
    <input id="q" type="search" aria-label="Search">
    <button class="ir" type="submit" aria-label="Go">→</button>
    <div class="resultados" id="resultados" role="listbox"></div>
  </form>
  <div class="acciones">
    <select class="chipbtn" id="selRegion" aria-label="Region"></select>
    <button class="chipbtn" id="btnIdioma"></button>
    <a class="chipbtn ocultar-movil" id="lnkTec" href="tecnico.html" style="display:grid;place-items:center;text-decoration:none"></a>
  </div>
</header>

<div class="app">
  <div id="mapa">
    <div class="flot capas" id="capas" role="group"></div>
    <div class="flot fecha" id="fechaBox"><label><span id="lFecha"></span> <input type="date" id="fecha"></label></div>
    <div class="flot modo" id="modo"><span id="modoTxt"></span><button id="modoX" aria-label="Close">✕</button></div>
    <div class="flot leyenda" id="leyenda"></div>
    <div class="flot tiempo" id="tiempo">
      <button class="play" id="play" aria-label="Play">▶</button>
      <select id="repAnio" aria-label="Year"></select>
      <input type="range" id="repSem" min="0" max="51" value="0" aria-label="Week">
      <b id="repTxt"></b>
    </div>
    <div class="flot bienvenida" id="bienvenida">
      <button class="x" id="cerrarBienv" aria-label="Close">×</button>
      <h2 id="bTit"></h2>
      <p id="bTxt"></p>
      <div class="atajos" id="atajos"></div>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="sec">
      <div id="avisoSint"></div>
      <div class="lugar"><div class="pin">📍</div><div style="flex:1"><h2 id="lugarNom"></h2><div class="sub" id="lugarSub"></div></div></div>
      <div class="escala" id="escala"></div>
    </div>
    <div class="sec" style="padding-top:0">
      <div class="kicker" id="kResp"></div>
      <div class="respuesta" id="r1"></div>
      <div class="respuesta" id="r2"></div>
      <div class="respuesta" id="r3"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section class="tab" id="tab-cal"></section>
    <section class="tab" id="tab-anios"></section>
    <section class="tab" id="tab-alertas"></section>
    <section class="tab" id="tab-reglas"></section>
    <section class="tab" id="tab-riesgo"></section>
    <section class="tab" id="tab-areas"></section>
    <section class="tab" id="tab-prueba"></section>
    <section class="tab" id="tab-como"></section>
    <div class="pie" id="pie"></div>
  </aside>
</div>
<div id="tip"></div>

<script src="data/regiones.js"></script>
<script>
  (function () {
    var R = window.REGIONES || [], q = null, l = null;
    try { var u = new URLSearchParams(location.search); q = u.get("region"); l = u.get("lang"); } catch (e) {}
    var ok = R.some(function (r) { return r.clave === q; });
    window.CLAVE_REGION = ok ? q : (R[0] ? R[0].clave : "yucatan");
    window.IDIOMA = l === "es" ? "es" : "en";
    document.write('<script src="data/' + window.CLAVE_REGION + '.js"><\/script>');
  })();
</script>
<script src="js/app.js"></script>
</body>
</html>
